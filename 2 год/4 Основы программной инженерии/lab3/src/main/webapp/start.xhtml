<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>ЛР3 — стартовая страница</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="#{facesContext.externalContext.requestContextPath}/static/style.css"/>
</h:head>
<h:body>

    <button id="theme-toggle" class="theme-btn" type="button" aria-label="Переключить тему">
        🌙 Тема
    </button>

    <h:panelGroup layout="block" style="display:flex;flex-direction:column;align-items:center;margin-top:24px;gap:20px;">

        <div class="header-wrap" style="text-align:center;">
            <h1>Бармичев Григорий Андреевич — P3210</h1>
            <small>Веб-программирование — Лабораторная работа #3 — Вариант 11</small>
        </div>

        <canvas id="analog-clock" width="220" height="220" style="display:block;"/>

        <div class="clock-block" style="text-align:center;">
            <div class="clock-title">Текущая дата и время:</div>
            <div id="clock" class="clock-value">--:--:--</div>
        </div>

        <div style="margin-top: 10px;">
            <h:form>
                <h:commandButton value="Перейти к приложению" styleClass="btn" action="main"/>
            </h:form>
        </div>
    </h:panelGroup>

    <script src="#{facesContext.externalContext.requestContextPath}/static/theme.js"></script>
    <script src="#{facesContext.externalContext.requestContextPath}/static/start.js"></script>
</h:body>
</html>
